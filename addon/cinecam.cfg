# Cinematic Replay settings.
# This copy lives in %LOCALAPPDATA%\Swofty\cinematic-replay\cinecam.cfg and is re-read about twice a second while
# the game runs. Most settings are also in the editor's Options pane, which saves them here.

# The edit the editor opens: sequences\<name>.json next to this file. The editor's Edit menu makes, switches,
# renames and deletes edits and keeps this line up to date.
sequence = my_edit

# Sound. move_listener (read at game start): hear the replay from our camera's position.
# sound_follows_shot: keep the replay's own camera on the shot's car, so its live engine sounds play.
# recorded_passby (read at game start): the game's recorded trackside pass-by sounds; 0 turns them off.
move_listener = 1
sound_follows_shot = 1
recorded_passby = 1

# 1: the game's replay HUD is hidden while the editor is open (and comes back as it was when it closes)
editor_hides_hud = 1
# the speed curve new slider keys get between them: 0 smooth (eases out and in), 1 linear
key_curve = 0
# 1: the 3D camera path turns red where it goes into the track or a barrier (orange: within 30 cm of the ground)
check_clipping = 1

# Final Cut: plays the edit with every HUD hidden, after a black run-up of `preroll` seconds.
# letterbox = an aspect ratio for black bars (e.g. 2.39), 0 = none. fade = seconds from / to black (Final Cut only;
# renders never fade, do that in post).
preroll = 1.0
letterbox = 0
fade = 0

# Render: the edit stepped frame by frame and encoded with ffmpeg, then played once more in real time to record
# the game's sound, which is joined to the video.
# Output: render_dir (empty = your Windows Videos folder \ Cinematic Replay). ffmpeg: empty = found on PATH or
# from WinGet (winget install Gyan.FFmpeg).
# render_settle: rendered frames each output frame is held for before it is captured (8 to 60; fewer left
# frames with the cars shown twice).
# render_format: 0 H.264 (.mp4, render_crf = quality, lower is better), 3 H.265 (.mp4, same render_crf scale,
# much smaller files), 1 ProRes 422 HQ (.mov), 2 ProRes 4444 XQ (.mov). ProRes is 10-bit and larger, with
# uncompressed sound, for grading in post.
# render_blur: motion blur samples per frame (1 = off; 4, 8, 16: the render takes that many times longer),
# spread over render_shutter degrees (180 = the classic film look).
render_fps = 60
render_settle = 12
render_format = 0
render_crf = 16
render_blur = 1
render_shutter = 180
render_audio = 1
# the sound pass waits this many seconds at its start while the game loads that part of the replay
render_audio_wait = 3
# shifts the sound if it ever sounds off (seconds, + = earlier); normally 0
render_audio_offset = 0
render_dir =
ffmpeg =
